name: Daily quotes

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC du lundi au vendredi, après la clôture de New York
  workflow_dispatch:          # bouton « Run workflow » pour lancer un relevé à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relever les cours de clôture
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python fetch_quotes.py
      - name: Enregistrer quotes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git diff --staged --quiet || git commit -m "Cours de clôture $(date -u +%F)"
          git push
